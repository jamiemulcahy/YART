name = "yart-worker"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
# Origins allowed to call the API cross-origin. The dev frontend proxies /api, so it doesn't need an entry.
ALLOWED_ORIGINS = "http://localhost:5173"

[dev]
port = 8787
ip = "0.0.0.0"  # Required for container environments

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
